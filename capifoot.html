ight:900;box-shadow:0 3px 10px #0008;animation:bob 1.4s ease-in-out infinite alternate}.player-dot:nth-child(even){animation-delay:.3s}@keyframes bob{from{translate:0 0}to{translate:0 -5px}}.ball{position:absolute;z-index:3;left:50%;top:50%;font-size:20px;animation:ballmove 3s ease-in-out infinite alternate}@keyframes ballmove{from{left:48%;top:48%}to{left:68%;top:34%}}.matchscore{display:flex;align-items:center;justify-content:space-around;text-align:center;padding:20px;gap:8px}.teamscore{flex:1}.score{font-size:36px;font-weight:1000}.event{padding:10px;border-left:2px solid #888;background:#191919;border-radius:0 8px 8px 0;font-size:13px}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f2f2f2;color:#111;padding:12px 18px;border-radius:99px;box-shadow:0 8px 35px #0008;z-index:30;font-weight:700}.bottomnav{display:none}.footer{color:#777;font-size:11px;padding:25px 0;text-align:center}.empty{padding:30px;text-align:center;color:#aaa}.badge{display:inline-block;border-radius:6px;background:#2b2b2b;padding:4px 7px;font-size:11px;color:#ddd}

function makeRoster(){if(state.roster.length)return;const names=['Goleiro titular','Lateral-direito','Zagueiro central','Zagueiro construtor','Lateral-esquerdo','Volante marcador','Meio-campista','Meia criativo','Ponta direita','Centroavante','Ponta esquerda','Goleiro reserva','Defensor reserva','Volante reserva','Meia reserva','Atacante reserva'];const pos=['GOL','LD','ZAG','ZAG','LE','VOL','MC','MEI','PD','CA','PE','GOL','DEF','VOL','MEI','ATA'];state.roster=names.map((n,i)=>({id:'p'+i,name:n,position:pos[i],age:18+(i*3)%15,ovr:61+(i*7)%26,potential:70+(i*11)%30,wage:12000+(i*3400),value:500000+(i*700000),status:i<11?'Titular':'Reserva'}))}
function squadPage(){makeRoster();return `<div class="section-head"><div><h2>Elenco</h2><p>Dados de demonstração — substituir por plantéis verificados de 2026.</p></div><button onclick="go('market')">+ Contratar</button></div><div class="toolbar"><input id="squadSearch" placeholder="Buscar jogador ou posição…" oninput="filterSquad()"><select id="posFilter" onchange="filterSquad()"><option value="">Todas as posições</option>${['GOL','LD','ZAG','LE','VOL','MC','MEI','PD','CA','PE','DEF','ATA'].map(x=>`<option>${x}</option>`).join('')}</select><button onclick="toast('Relatório de elenco atualizado')">Relatório</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Jogador</th><th>Pos.</th><th>Idade</th><th>OVR</th><th>Potencial</th><th>Valor estimado</th><th>Salário/mês</th><th>Status</th></tr></thead><tbody id="squadRows">${rosterRows(state.roster)}</tbody></table></div><p class="muted">Os nomes genéricos existem apenas para demonstrar os sistemas. Não representam jogadores reais nem dados do OGol/Transfermarkt.</p>`}
function rosterRows(list){return list.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.position}</td><td>${p.age}</td><td>${p.ovr}</td><td>${p.potential}</td><td>${fmt(p.value)}</td><td>${fmt(p.wage)}</td><td><select onchange="setPlayerStatus('${p.id}',this.value)"><option ${p.status==='Titular'?'selected':''}>Titular</option><option ${p.status==='Reserva'?'selected':''}>Reserva</option><option ${p.status==='Transferível'?'selected':''}>Transferível</option></select></td></tr>`).join('')}
function filterSquad(){let q=(document.getElementById('squadSearch')?.value||'').toLowerCase(),p=document.getElementById('posFilter')?.value||'';document.getElementById('squadRows').innerHTML=rosterRows(state.roster.filter(x=>(x.name.toLowerCase().includes(q)||x.position.toLowerCase().includes(q))&&(!p||x.position===p)))}function setPlayerStatus(id,s){let p=state.roster.find(x=>x.id===id);if(p)p.status=s}
function matchPage(){let c=club();return `<div class="section-head"><div><h2>Central de partidas</h2><p>Campo 2D animado · protótipo de movimento visual e simulação.</p></div><div class="toolbar"><button onclick="state.speed=state.speed===1?2:state.speed===2?4:1;render()">Velocidade: ${state.speed}×</button><button class="primary" onclick="playMatch()">▶ Simular resultado</button></div></div><div class="card"><div class="matchscore"><div class="teamscore">${crest(c,true)}<b>${esc(c.name)}</b></div><div><div class="score" id="score">— : —</div><div class="muted">Rodada ${state.round}</div></div><div class="teamscore">${crest({abbr:'ADV',name:'Adversário'},true)}<b>Adversário</b></div></div><div class="pitch" id="pitch">${[[50,8,'GK'],[20,24,'DF'],[40,20,'DF'],[60,20,'DF'],[80,24,'DF'],[30,42,'MC'],[50,38,'MC'],[70,42,'MC'],[25,66,'AT'],[50,72,'AT'],[75,66,'AT']].map((p,i)=>`<div class="player-dot" style="left:${p[0]}%;top:${p[1]}%;animation-duration:${1.2+((i%4)*.4)/state.speed}s">${p[2]}</div>`).join('')}<div class="ball" style="animation-duration:${3/state.speed}s">⚽</div><div style="position:absolute;bottom:17px;left:50%;transform:translateX(-50%);z-index:4;background:#0009;border-radius:99px;padding:5px 12px;font-size:11px">SIMULAÇÃO 2D · ${state.speed}×</div></div><div class="section-head"><div><h2>Eventos da partida</h2><p>Os eventos aparecem depois de simular o jogo.</p></div></div><div id="matchEvents" class="stack"><div class="event">A partida ainda não começou. Toque em “Simular resultado”.</div></div></div>`}
function playMatch(){let a=Math.floor(Math.random()*4),b=Math.floor(Math.random()*4);state.played++;state.round++;document.getElementById('score').textContent=a+' : '+b;let ev=[];for(let i=0;i<a;i++)ev.push(`<div class="event">⚽ ${12+i*19}' — Gol do ${esc(club().name)}.</div>`);for(let i=0;i<b;i++)ev.push(`<div class="event">⚽ ${18+i*21}' — Gol do adversário.</div>`);ev.push(`<div class="event">⏱ Fim de jogo. Resultado de demonstração gerado pelo simulador.</div>`);document.getElementById('matchEvents').innerHTML=ev.join('');toast('Partida simulada!');}

function worldPage(){let all=clubSeed.concat(state.customClubs);return `<div class="section-head"><div><h2>Mundo do futebol</h2><p>Explore clubes por país e escolha uma carreira.</p></div></div><div class="toolbar"><input id="clubSearch" placeholder="Buscar clube ou país…" oninput="filterClubs()"><select id="countryFilter" onchange="filterClubs()"><option value="">Todos os países</option>${[...new Set(all.map(c=>c.country))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="clubGrid" class="grid">${clubCards(all)}</div><p class="muted">Catálogo inicial demonstrativo com clubes conhecidos. Não representa uma base completa de clubes licenciados.</p>`}

function filterClubs(){let q=(document.getElementById('clubSearch')?.value||'').toLowerCase(),country=document.getElementById('countryFilter')?.value||'';document.getElementById('clubGrid').innerHTML=clubCards(clubSeed.concat(state.customClubs).filter(c=>(c.name.toLowerCase().includes(q)||c.country.toLowerCase().includes(q))&&(!country||c.country===country)))}function chooseClub(id){let c=clubSeed.concat(state.customClubs).find(c=>c.id===id);if(!c)return;state.clubId=id;state.money=c.budget;state.roster=[];toast('Agora você comanda '+c.name);go('home')}
function marketPage(){return `<div class="section-head"><div><h2>Mercado de transferências</h2><p>Busca avançada, contratos e negociação — sistemas demonstrativos.</p></div><span class="tag">Janela aberta</span></div><div class="card"><div class="formgrid"><div class="field"><label>Nome do jogador</label><input id="mq" placeholder="Nome ou palavra-chave"></div><div class="field"><label>Posição</label><select id="mp"><option>Todas</option>${['GOL','LD','ZAG','LE','VOL','MC','MEI','PD','CA','PE'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Idade máxima</label><input id="mage" type="number" value="25" min="15" max="45"></div><div class="field"><label>Orçamento máximo (R$)</label><input id="mval" type="number" value="20000000"></div><div class="field"><label>Contrato</label><select id="mcontract"><option>Qualquer</option><option>Termina em até 6 meses</option><option>Emprestável</option><option>Agente livre</option></select></div><div class="field"><label>País / liga</label><select id="mcountry"><option>Todos</option>${[...new Set(clubSeed.map(c=>c.country))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div><button class="primary" style="margin-top:14px" onclick="searchMarket()">⌕ Buscar jogadores</button></div><div class="section-head"><div><h2>Resultados de busca</h2><p id="marketCaption">Pesquise para gerar uma lista de demonstração.</p></div></div><div id="marketResults" class="stack"><div class="empty">Use os filtros acima para buscar jogadores.</div></div><p class="muted">Jogadores reais, valores de mercado e contratos não estão conectados a uma base externa nesta versão. Não são apresentados nomes inventados como se fossem atletas reais.</p>`}
function searchMarket(){let q=document.getElementById('mq').value||'Jogador em observação',pos=document.getElementById('mp').value,age=+document.getElementById('mage').value,val=+document.getElementById('mval').value;let results=Array.from({length:6},(_,i)=>({name:`Alvo de scouting ${i+1}`,pos:pos==='Todas'?['MC','ZAG','CA','GOL','MEI','LE'][i]:pos,age:Math.max(16,Math.min(38,age-i)),value:Math.min(val,600000+((i+2)*1.7e6)),ovr:58+i*4,contract:['Contrato até 2027','Disponível por empréstimo','Contrato até 2026'][i%3]}));document.getElementById('marketCaption').textContent=`${results.length} perfis de demonstração para “${q}”`;document.getElementById('marketResults').innerHTML=results.map((p,i)=>`<div class="card"><div class="row"><div><h3>${esc(p.name)} <span class="tag">${p.pos}</span></h3><div class="muted">${p.age} anos · OVR ${p.ovr} · ${p.contract}</div><div class="muted">Valor estimado: ${fmt(p.value)}</div></div><button onclick="offerPlayer(${i},${p.value})">Negociar</button></div></div>`).join('')}
function offerPlayer(i,v){if(state.money<v){toast('Orçamento insuficiente para essa proposta.');return}if(confirm(`Enviar proposta de ${fmt(v)}? Este é um jogador demonstrativo.`)){state.money-=v;toast('Proposta enviada. O orçamento foi atualizado.');}}
function financesPage(){let c=club();return `<div class="section-head"><div><h2>Finanças</h2><p>Controle de caixa, dívidas, salários e receitas.</p></div><button onclick="exportReport()">Exportar relatório</button></div><div class="grid"><div class="card"><div class="muted">Orçamento de transferências</div><div class="metric">${fmt(state.money)}</div></div><div class="card"><div class="muted">Dívida cadastrada do clube</div><div class="metric">${fmt(c.debt)}</div><div class="muted">Valor ilustrativo, não auditado</div></div><div class="card"><div class="muted">Salários mensais do elenco demo</div><div class="metric">${fmt(state.roster.reduce((s,p)=>s+p.wage,0))}</div></div></div><div class="section-head"><div><h2>Planejamento financeiro</h2><p>Registre uma receita ou despesa na carreira.</p></div></div><div class="card"><div class="formgrid"><div class="field"><label>Tipo</label><select id="ftype"><option value="in">Receita</option><option value="out">Despesa</option></select></div><div class="field"><label>Valor (R$)</label><input id="fvalue" type="number" min="0" value="1000000"></div><div class="field"><label>Categoria</label><select id="fcat"><option>Patrocínio</option><option>Bilheteria</option><option>Premiação</option><option>Transferência</option><option>Salários</option><option>Manutenção</option><option>Pagamento de dívida</option></select></div><div class="field"><label>Descrição</label><input id="fdesc" placeholder="Descrição do lançamento"></div></div><button class="primary" style="margin-top:14px" onclick="addFinance()">Registrar lançamento</button></div><div class="section-head"><div><h2>Livro-caixa da carreira</h2></div></div><div id="ledger" class="card stack">${(state.ledger||[]).length?state.ledger.map(x=>`<div class="listrow"><div class="grow"><strong>${esc(x.cat)} — ${esc(x.desc)}</strong><span class="muted">${x.date}</span></div><b class="${x.type==='in'?'good':'bad'}">${x.type==='in'?'+':'−'}${fmt(x.value)}</b></div>`).join(''):'<div class="em function createClub(){let name=document.getElementById('eName').value.trim();if(!name){toast('Digite um nome para o clube');return}let id='custom'+Date.now();let c={id,name,country:document.getElementById('eCountry').value,league:document.getElementById('eLeague').value,abbr:(document.getElementById('eAbbr').value||'NFC').toUpperCase(),titles:'Nenhum título registrado',budget:+document.getElementById('eBudget').value||0,debt:+document.getElementById('eDebt').value||0,stadium:document.getElementById('eStadium').value||'A definir',rep:Math.min(100,Math.max(1,+document.getElementById('eRep').value||50))};state.customClubs.push(c);state.editorClub=name;toast('Clube criado!');chooseClub(id)}
function createPlayer(){makeRoster();let name=document.getElementById('epName').value.trim();if(!name){toast('Digite o nome do jogador');return}state.roster.push({id:'p'+Date.now(),name,position:document.getElementById('epPos').value,age:+document.getElementById('epAge').value,ovr:+document.getElementById('epOvr').value,potential:+document.getElementById('epPot').value,wage:+document.getElementById('epWage').value,value:Math.max(10000,(+document.getElementById('epOvr').value)*100000),status:'Reserva'});toast('Jogador adicionado');go('squad')}
function historyPage(){return `<div class="section-head"><div><h2>Histórico e títulos</h2><p>Separação entre conquistas históricas reais e resultados da sua carreira.</p></div></div><div class="card"><h3>🏆 Títulos históricos do ${esc(club().name)}</h3><p class="muted">O catálogo definitivo deve registrar competição, temporada, reconhecimento oficial e fonte. Não inserimos números não verificados como fatos.</p><div class="listrow"><div class="grow"><strong>Campeonatos nacionais</strong><span class="muted">A validar com fontes oficiais por clube</span></div><span class="tag">Pendente</span></div><div class="listrow"><div class="grow"><strong>Copas nacionais e estaduais</strong><span class="muted">A validar por temporada</span></div><span class="tag">Pendente</span></div><div class="listrow"><div class="grow"><strong>Continental e mundial</strong><span class="muted">A validar com organizadores</span></div><span class="tag">Pendente</span></div></div><div class="section-head"><div><h2>Minha carreira</h2><p>Conquistas realizadas neste save.</p></div><button onclick="addCareerTitle()">+ Registrar título</button></div><div class="card">${state.careerTitles.length?state.careerTitles.map(t=>`<div class="listrow"><span>🏆</span><div class="grow"><strong>${esc(t.name)}</strong><span class="muted">Temporada ${t.season}</span></div></div>`).join(''):'<div class="empty">Você ainda não conquistou títulos nesta carreira.</div>'}</div>`}
function addCareerTitle(){let n=prompt('Qual título você conquistou?');if(n){state.careerTitles.push({name:n,season:state.season});toast('Título adicionado ao histórico');render()}}
function settingsPage(){return `<div class="section-head"><div><h2>Configurações</h2><p>Gerencie a carreira local.</p></div></div><div class="card stack"><div class="row"><div><b>Temporada</b><div class="muted">Avance para a próxima temporada.</div></div><button onclick="nextSeason()">Avançar temporada →</button></div><div class="row"><div><b>Salvar carreira</b><div class="muted">Guarda os dados neste navegador.</div></div><button onclick="saveGame()">Salvar</button></div><div class="row"><div><b>Exportar save</b><div class="muted">Baixa um arquivo JSON com sua carreira.</div></div><button onclick="exportSave()">Exportar JSON</button></div><div class="row"><div><b>Importar save</b><div class="muted">Carrega um JSON exportado anteriormente.</div></div><button onclick="document.getElementById('importFile').click()">Importar</button><input class="hidden" id="importFile" type="file" accept="application/json" onchange="importSave(event)"></div><div class="row"><div><b>Reiniciar carreira</b><div class="muted">Apaga o save local e volta ao início.</div></div><button onclick="resetGame()">Reiniciar</button></div></div><p class="muted">O salvamento local funciona neste navegador e aparelho. Para sincronizar entre dispositivos, será necessário backend/conta de usuário.</p>`}
function nextSeason(){state.season++;state.round=1;state.played=0;state.money+=5000000;toast('Temporada '+state.season+' iniciada');render()}
function saveGame(){try{localStorage.setItem('capifoot_save_v1',JSON.stringify(state));state.savedAt=new Date().toISOString();toast('Carreira salva neste navegador.')}catch(e){toast('Não foi possível salvar neste navegador. Exporte o JSON.')}}
function loadGame(){try{let s=localStorage.getItem('capifoot_save_v1');if(s)state={...state,...JSON.parse(s)}}catch(e){}}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='capifoot-save.json';a.click();URL.revokeObjectURL(a.href)}function importSave(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state={...state,...JSON.parse(r.result)};render();toast('Carreira importada')}catch(err){toast('Arquivo JSON inválido')}};r.readAsText(f)}
function exportReport(){let c=club(),txt=`CapiFOOT — Relatório financeiro\nClube: ${c.name}\nTemporada: ${state.season}\nOrçamento: ${fmt(state.money)}\nDívida cadastrada: ${fmt(c.debt)}\nObservação: dados demonstrativos, não auditados.`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='capifoot-relatorio.txt';a.click();URL.revokeObjectURL(a.href)}function resetGame(){if(confirm('Apagar a carreira local?')){localStorage.removeItem('capifoot_save_v1');state={page:'home',clubId:'cor',season:2026,round:1,money:125000000,careerTitles:[],played:0,table:null,roster:[],market:[],news:[],savedAt:null,editorClub:'Novo FC',customClubs:[],sponsor:'A negociar',training:'Equilibrado',speed:1};render();toast('Carreira reiniciada')}}
loadGame();render();
</script></body></html>
